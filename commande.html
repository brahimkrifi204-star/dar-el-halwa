                <label>date de retrait</label><input type="date" id="date" name="date" min="2026-09-01" require><br>
                <label>nombre de pates</label><input type="number" max="100" min="2"><br>
                <label>parfumes souhaites</label> <input type="checkbox" id="p-choco" name="parfums[]" value="chocolat" checked>

      <label for="p-pistache">Pistache</label>
      <input type="checkbox" id="p-fruits" name="parfums[]" value="fruits-rouges">
